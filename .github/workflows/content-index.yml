name: Conceptual content index

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/content-index-config.json"
      - ".github/content-index.jsonl"
      - ".github/workflows/content-index.yml"
      - "tools/content_index/**"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".github/content-index-config.json"
      - ".github/content-index.jsonl"
      - ".github/workflows/content-index.yml"
      - "tools/content_index/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Run content index tests
        run: python -m unittest tools.content_index.test_content_index
      - name: Check generated index
        run: python tools/content_index/content_index.py check
      - name: Create duplicate candidate report
        run: |
          python tools/content_index/content_index.py audit \
            --threshold 0.72 \
            --limit 200 > content-duplicate-audit.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-duplicate-audit
          path: content-duplicate-audit.md
